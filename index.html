<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef3fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c111b" media="(prefers-color-scheme: dark)">
<title>Roblox 创作者生态研究</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#eef3fb;
  --bg2:#f8fbff;
  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.76);
  --glass-soft:rgba(255,255,255,.38);
  --line:rgba(255,255,255,.72);
  --line2:rgba(82,96,122,.20);
  --tx:#172033;
  --tx2:#526078;
  --tx3:#7d889b;
  --accent:#087cf0;
  --accent-soft:rgba(8,124,240,.10);
  --positive:#087e5b;
  --shadow:0 18px 54px rgba(41,60,93,.12),0 2px 10px rgba(41,60,93,.06);
  --shadow-hover:0 24px 64px rgba(41,60,93,.17),0 4px 14px rgba(41,60,93,.09);
  --blur:saturate(180%) blur(26px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;min-height:100vh;background:
  radial-gradient(circle at 9% 7%,rgba(97,172,255,.26),transparent 29rem),
  radial-gradient(circle at 88% 16%,rgba(197,145,255,.20),transparent 27rem),
  radial-gradient(circle at 52% 82%,rgba(85,214,190,.16),transparent 34rem),
  linear-gradient(145deg,var(--bg2),var(--bg));
  background-attachment:fixed;color:var(--tx);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:
  linear-gradient(115deg,rgba(255,255,255,.38),transparent 32%),
  radial-gradient(circle at 50% -12%,rgba(255,255,255,.86),transparent 42rem)}
button,input,select{font-family:inherit}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 30px 100px}
header{padding:38px 4px 22px}
h1{font-size:25px;font-weight:650;margin:0 0 6px;letter-spacing:-.45px}
.sub{color:var(--tx2);font-size:13px}
.stats{color:var(--tx3);font-size:13px;margin-top:10px}
.stats b{color:var(--tx);font-weight:650}
.hidden{display:none!important}

.topnav{position:sticky;top:0;z-index:30;background:rgba(248,251,255,.56);border-bottom:1px solid rgba(255,255,255,.74);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 1px 18px rgba(49,68,98,.06)}
.topnavin{max-width:1180px;margin:0 auto;padding:10px 30px;display:flex;align-items:center;gap:16px}
.brand{font-size:14px;font-weight:650;white-space:nowrap;letter-spacing:-.1px}
.brand::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;
  background:linear-gradient(145deg,#58adff,#087cf0);box-shadow:0 0 0 4px rgba(8,124,240,.10),inset 0 1px 1px rgba(255,255,255,.7)}
.navtabs{display:flex;gap:3px;margin-left:auto;padding:3px;background:rgba(118,133,158,.11);border:1px solid rgba(255,255,255,.62);border-radius:11px}
.navtabs button{font-size:13px;line-height:1;padding:7px 15px;border:0;border-radius:8px;background:transparent;color:var(--tx2);cursor:pointer;transition:.18s ease}
.navtabs button:hover{background:rgba(255,255,255,.48);color:var(--tx)}
.navtabs button.on{background:var(--glass-strong);color:var(--tx);box-shadow:0 2px 8px rgba(35,52,82,.12),inset 0 0 0 1px rgba(255,255,255,.58)}

.hero{position:relative;margin-top:26px;padding:44px 44px 39px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.38));
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow);overflow:hidden}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-74px;top:-132px;
  background:radial-gradient(circle,rgba(74,160,255,.25),rgba(152,110,255,.09) 50%,transparent 71%);pointer-events:none}
.eyebrow{font-size:12px;color:var(--accent);font-weight:650;letter-spacing:.7px;margin-bottom:11px;text-transform:uppercase}
.hero h1{position:relative;z-index:1;max-width:940px;font-size:32px;line-height:1.34;margin:0 0 18px;letter-spacing:-.75px;font-weight:680}
.hero-meta{font-size:12px;color:var(--tx3)}
.hsection{padding:31px 2px 2px}
.secthead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:14px;padding:0 3px}
.secthead h2{font-size:18px;font-weight:650;margin:0;letter-spacing:-.25px}
.secthead span{font-size:12px;color:var(--tx3)}
.summarybox,.metric,.creatorstrip,.ecocard,.event,.gcard,.card,.bcol{background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.summarybox{border-radius:20px;padding:22px 26px}
.summarybox ul{margin:0;padding-left:21px;display:grid;gap:10px}
.summarybox li{padding-left:4px;line-height:1.72}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.metric{border-radius:19px;padding:18px 20px;text-decoration:none;color:inherit;min-height:154px;display:flex;flex-direction:column;transition:.22s ease}
.metric:hover,.ecocard:hover,.event:hover,.gcard:hover{transform:translateY(-3px);background:var(--glass-strong);box-shadow:var(--shadow-hover)}
.mvalue{font-size:27px;line-height:1.18;font-weight:680;letter-spacing:-.6px}
.mlabel{font-size:13px;margin-top:5px;font-weight:650}
.mdelta{font-size:12px;color:var(--positive);margin-top:3px;font-weight:550}
.mnote{font-size:12px;color:var(--tx2);line-height:1.55;margin-top:auto;padding-top:12px}
.msrc{font-size:10px;color:var(--tx3);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.creatorstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:19px;overflow:hidden}
.cmetric{padding:17px 19px;border-right:1px solid var(--line2);text-decoration:none;color:inherit;transition:.18s ease}
.cmetric:hover{background:rgba(255,255,255,.36)}
.cmetric:last-child{border-right:0}
.cmetric .v{font-size:22px;font-weight:680;letter-spacing:-.35px}
.cmetric .l{font-size:12px;font-weight:650;margin-top:2px}
.cmetric .n{font-size:11px;color:var(--tx3);margin-top:6px;line-height:1.45}
.ecogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.ecocard{border-radius:20px;padding:21px 23px;transition:.22s ease}
.ecotop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ecok{font-size:12px;color:var(--tx3);font-weight:650;letter-spacing:.5px}
.ecostatus{font-size:11px;color:var(--positive);background:rgba(20,174,123,.12);border:1px solid rgba(20,174,123,.14);padding:2px 8px;border-radius:999px;white-space:nowrap}
.ecocard h3{font-size:16px;line-height:1.45;margin:0 0 8px}
.ecosum{font-size:13px;color:var(--tx2);line-height:1.68;margin-bottom:11px}
.ecocard ul{font-size:13px;margin:0;padding-left:18px;line-height:1.64}
.ecocard li{margin:5px 0}
.refrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:11px;border-top:1px solid var(--line2)}
.ref{font-size:11px;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(8,124,240,.10);border-radius:999px;padding:4px 9px;cursor:pointer;transition:.16s ease}
.ref:hover{background:rgba(8,124,240,.17);transform:translateY(-1px)}
.events{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.event{border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;transition:.22s ease}
.eventmeta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--tx3);margin-bottom:9px}
.eventmeta .date{color:#6946c8;background:rgba(125,89,230,.12);border:1px solid rgba(125,89,230,.12);border-radius:999px;padding:2px 8px;font-weight:650}
.event h3{font-size:17px;margin:0 0 8px;line-height:1.4}
.eventsum{font-size:13px;color:var(--tx2);line-height:1.68;margin-bottom:11px}
.event ul{font-size:13px;margin:0;padding-left:18px;line-height:1.64}
.event li{margin:6px 0}
.event .refrow{margin-top:auto}
.gallery{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.gcard{grid-column:span 2;border-radius:20px;padding:20px 21px;min-height:220px;transition:.22s ease}
.gcard:nth-child(1),.gcard:nth-child(2){grid-column:span 3}
.gcard h3{font-size:15px;margin:0 0 8px}
.gsum{font-size:13px;color:var(--tx2);line-height:1.62;margin-bottom:11px}
.gcard ul{font-size:12px;margin:0 0 14px;padding-left:17px;color:var(--tx2)}
.gcard li{margin:4px 0}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.htag{font-size:11px;line-height:1.2;border:1px solid var(--line2);background:var(--glass-soft);color:var(--tx2);padding:5px 9px;border-radius:999px;cursor:pointer;transition:.16s ease}
.htag:hover{border-color:rgba(8,124,240,.35);background:var(--accent-soft);color:var(--accent)}
.latest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.latest .card{margin:0}
.sources{font-size:12px;color:var(--tx3);display:flex;gap:8px 18px;flex-wrap:wrap;padding:12px 4px 2px}
.sources a{color:var(--tx2);text-decoration:none}
.sources a:hover{color:var(--accent)}

.bar{position:sticky;top:56px;z-index:20;margin:0 -10px 28px;padding:13px 12px;background:rgba(247,250,255,.58);border:1px solid var(--line);border-radius:18px;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 12px 36px rgba(41,60,93,.10)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;border:1px solid var(--line2);background:var(--glass-soft);color:var(--tx2);transition:.16s ease}
.chip:hover{border-color:rgba(8,124,240,.30);background:var(--glass-strong)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 5px 16px rgba(8,124,240,.22)}
.spacer{flex:1}
input[type=text],select{font-size:13px;line-height:1;padding:8px 11px;border:1px solid var(--line2);border-radius:10px;background:var(--glass-strong);color:var(--tx);outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
input[type=text]{width:210px}
input[type=text]:focus,select:focus{border-color:rgba(8,124,240,.55);box-shadow:0 0 0 3px rgba(8,124,240,.10)}
.seg{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:rgba(118,133,158,.10);padding:2px}
.seg button{font-size:13px;line-height:1;padding:7px 12px;border:0;border-radius:7px;background:transparent;color:var(--tx2);cursor:pointer}
.seg button.on{background:var(--glass-strong);color:var(--tx);box-shadow:0 2px 7px rgba(35,52,82,.12)}

.month{font-size:13px;font-weight:650;color:var(--tx2);margin:0 0 12px;letter-spacing:.3px}
.group{display:grid;grid-template-columns:78px 1fr;gap:0;position:relative;padding-bottom:11px}
.gutter{position:relative}
.gutter .dot{position:absolute;left:14px;top:18px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.5)}
.gutter::after{content:"";position:absolute;left:18.5px;top:28px;bottom:-11px;width:1px;background:var(--line2)}
.group:last-child .gutter::after{display:none}
.ym{position:absolute;left:0;top:9px;width:34px;text-align:right;font-size:12px;color:var(--tx3);font-weight:550}
.cards{padding-left:7px}
.card{border-radius:17px;border-left:3px solid var(--tint,var(--line2));padding:17px 19px;margin-bottom:11px;cursor:pointer;transition:.20s ease}
.card:hover{background:var(--glass-strong);transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:15px;align-items:start}
.bcol{border-radius:20px;padding:15px 15px 7px}
.bcol h3{font-size:13px;font-weight:650;margin:0 2px 11px;display:flex;justify-content:space-between;align-items:baseline}
.bcol h3 em{font-style:normal;color:var(--tx3);font-weight:400;font-size:12px}
.bcol .card{margin-bottom:8px;padding:12px 14px;box-shadow:0 6px 20px rgba(41,60,93,.07)}
.bcol .ctitle{font-size:13px}
.bcol .takeaway{font-size:12px}
.bcol .meta{margin-top:6px}
.linkish{cursor:pointer;color:var(--accent)}
.linkish:hover{text-decoration:underline}
.originbox{margin:17px 0 0;padding:11px 13px;background:var(--glass-soft);border:1px solid var(--line2);border-radius:12px;font-size:12px;color:var(--tx2);word-break:break-all;line-height:1.6}
.copybtn{font-size:11px;line-height:1;margin-left:8px;padding:4px 9px;border:1px solid var(--line2);border-radius:999px;background:var(--glass-strong);color:var(--tx2);cursor:pointer}
.copybtn:hover{color:var(--accent);border-color:rgba(8,124,240,.35)}
.chead{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:550;white-space:nowrap}
.ctitle{font-size:15px;font-weight:650;letter-spacing:-.15px}
.takeaway{font-size:14px;color:var(--tx2);line-height:1.66}
.meta{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--tx3)}
.meta .sep{color:var(--line2)}
.st{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(110,120,138,.12);color:var(--tx2)}
.st.final{background:rgba(20,174,123,.12);color:var(--positive)}
.st.draft{background:rgba(226,150,31,.14);color:#946012}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:13px}
.grid .card{margin:0;display:flex;flex-direction:column}
.grid .takeaway{flex:1}
.empty{text-align:center;color:var(--tx3);padding:74px 20px;font-size:14px}

#ov{position:fixed;inset:0;background:rgba(24,31,46,.28);opacity:0;pointer-events:none;transition:.22s;z-index:50;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#ov.on{opacity:1;pointer-events:auto}
#panel{position:fixed;top:10px;right:10px;bottom:10px;width:min(760px,calc(100% - 20px));background:rgba(250,252,255,.78);border:1px solid rgba(255,255,255,.76);border-radius:24px;overflow-y:auto;
  -webkit-backdrop-filter:saturate(190%) blur(34px);backdrop-filter:saturate(190%) blur(34px);box-shadow:-24px 0 72px rgba(25,38,63,.22),inset 0 1px 0 rgba(255,255,255,.72);
  transform:translateX(28px) scale(.985);opacity:0;transition:.24s cubic-bezier(.2,.8,.2,1);z-index:51;pointer-events:none}
#panel.on{transform:none;opacity:1;pointer-events:auto}
.pwrap{padding:38px 46px 84px}
.pclose{position:sticky;top:0;float:right;font-size:13px;line-height:1;background:var(--glass-strong);border:1px solid var(--line2);border-radius:999px;padding:8px 13px;cursor:pointer;color:var(--tx2);box-shadow:0 4px 12px rgba(35,52,82,.08)}
.pclose:hover{color:var(--tx);background:rgba(255,255,255,.90)}
.ptitle{font-size:24px;font-weight:680;line-height:1.38;margin:16px 0 12px;letter-spacing:-.45px}
.ptake{background:var(--accent-soft);border:1px solid rgba(8,124,240,.12);border-left:3px solid var(--accent);border-radius:4px 13px 13px 4px;padding:14px 17px;font-size:14px;line-height:1.72;margin:17px 0}
.ptake .lb{font-size:11px;color:var(--tx3);display:block;margin-bottom:4px;letter-spacing:.5px}
.psrc{margin:19px 0 7px;padding:15px 0 0;border-top:1px solid var(--line2);font-size:13px;color:var(--tx2)}
.psrc .k{color:var(--tx3);margin-right:8px;font-size:12px}
.psrc ul{margin:6px 0 0;padding-left:18px}
.psrc li{margin:3px 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.body{margin-top:28px;font-size:15px;line-height:1.82}
.body h1,.body h2,.body h3{line-height:1.45;letter-spacing:-.2px}
.body h1{font-size:21px;margin:31px 0 12px}
.body h2{font-size:18px;margin:27px 0 10px}
.body h3{font-size:15px;margin:21px 0 8px;color:var(--tx)}
.body p{margin:11px 0}
.body ul,.body ol{margin:11px 0;padding-left:22px}
.body li{margin:5px 0}
.body blockquote{margin:14px 0;padding:11px 16px;border-left:3px solid var(--line2);color:var(--tx2);background:var(--glass-soft);border-radius:0 12px 12px 0}
.body code{background:rgba(110,120,138,.12);padding:2px 6px;border-radius:6px;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.body pre{background:rgba(245,248,253,.60);border:1px solid var(--line2);border-radius:13px;padding:15px 17px;overflow-x:auto}
.body pre code{background:none;padding:0}
.body table{width:100%;border-collapse:separate;border-spacing:0;margin:15px 0;font-size:14px;overflow:hidden;border:1px solid var(--line2);border-radius:12px}
.body th,.body td{border:0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:9px 11px;text-align:left}
.body tr:last-child td{border-bottom:0}.body th:last-child,.body td:last-child{border-right:0}
.body th{background:var(--glass-soft);font-weight:650}
.body hr{border:0;border-top:1px solid var(--line2);margin:25px 0}
.wikilink{background:rgba(125,89,230,.12);color:#6946c8;padding:2px 7px;border-radius:999px;font-size:13px}
.foot{margin-top:50px;padding-top:20px;border-top:1px solid rgba(255,255,255,.66);font-size:12px;color:var(--tx3);text-align:center}

@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .topnav,.bar,#panel,.summarybox,.metric,.creatorstrip,.ecocard,.event,.gcard,.card,.bcol{background:rgba(250,252,255,.96)}
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0c111b;--bg2:#131b2a;--glass:rgba(25,34,50,.61);--glass-strong:rgba(34,45,63,.82);--glass-soft:rgba(38,49,68,.42);
    --line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.15);--tx:#f3f6fb;--tx2:#bac4d4;--tx3:#8491a5;--accent:#5aa9ff;
    --accent-soft:rgba(90,169,255,.14);--positive:#54d5ad;--shadow:0 20px 58px rgba(0,0,0,.28),0 2px 10px rgba(0,0,0,.18);
    --shadow-hover:0 26px 68px rgba(0,0,0,.40),0 4px 15px rgba(0,0,0,.23)
  }
  body{background:radial-gradient(circle at 10% 8%,rgba(41,106,178,.28),transparent 30rem),radial-gradient(circle at 88% 14%,rgba(109,65,166,.23),transparent 27rem),radial-gradient(circle at 52% 83%,rgba(31,124,111,.19),transparent 34rem),linear-gradient(145deg,var(--bg2),var(--bg))}
  body::before{background:linear-gradient(115deg,rgba(255,255,255,.035),transparent 32%),radial-gradient(circle at 50% -12%,rgba(82,118,170,.12),transparent 42rem)}
  .topnav{background:rgba(15,22,34,.65);border-bottom-color:rgba(255,255,255,.10)}
  .navtabs button:hover,.cmetric:hover{background:rgba(255,255,255,.07)}
  .hero{background:linear-gradient(135deg,rgba(38,50,70,.74),rgba(20,29,44,.48))}
  .hero::after{background:radial-gradient(circle,rgba(55,137,230,.24),rgba(125,85,194,.11) 50%,transparent 71%)}
  .bar{background:rgba(17,25,39,.67)}
  input[type=text],select{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .pclose:hover{background:rgba(55,68,91,.92)}
  #ov{background:rgba(2,6,12,.48)}
  #panel{background:rgba(18,26,40,.82);border-color:rgba(255,255,255,.13);box-shadow:-24px 0 72px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.08)}
  .eventmeta .date{color:#c1adff}.st.draft{color:#f0bd61}.wikilink{color:#c1adff}
  .body pre{background:rgba(10,15,24,.48)}
}
@media(max-width:760px){
  .wrap,.topnavin{padding-left:16px;padding-right:16px}
  .hero{margin-top:18px;padding:31px 24px 27px;border-radius:23px}.hero h1{font-size:25px}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .creatorstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cmetric:nth-child(2){border-right:0}.cmetric:nth-child(-n+2){border-bottom:1px solid var(--line2)}
  .ecogrid,.events,.latest{grid-template-columns:1fr}
  .gallery{grid-template-columns:1fr}.gcard,.gcard:nth-child(1),.gcard:nth-child(2){grid-column:span 1}

      "bullets": [
        "发行商为规模化服务，不替代创意判断",
        "头部团队开始具备自研、自发和收购运营能力"
      ]
    },
    {
      "title": "平台能力与创作者计划",
      "summary": "Roblox 从直接给钱转向资源、工具和社区连接，补齐新人进入和高阶孵化两端。",
      "topics": [
        "GDC2026",
        "创作者计划"
      ],
      "bullets": [
        "Jump Start 面向外部新手",
        "Incubator 面向已有经验的创作者"
      ]
    },
    {
      "title": "国内 UGC 对比",
      "summary": "蛋仔、PUBGM 和 MC 已证明国内能形成商业化和工作室，但仍缺作者品牌和跨平台用户关系。",
      "topics": [
        "国内对比"
      ],
      "bullets": [
        "工具、商业化和经营能力已具备",
        "差距转向制度、文化和创作者主权"
      ]
    }
  ],
  "sources": [
    {
      "label": "Roblox Q2 2026 Shareholder Letter",
      "url": "https://www.sec.gov/Archives/edgar/data/1315098/000162828026051059/ex991-robloxq22026earnin.htm"
    },
    {
      "label": "Roblox Q4 2025 / FY2025 Shareholder Letter",
      "url": "https://www.sec.gov/Archives/edgar/data/1315098/000131509826000009/ex991-q42025shareholder.htm"
    },
    {
      "label": "Roblox Creator Hub · Earn on Roblox",
      "url": "https://create.roblox.com/docs/production/earn-on-roblox"
    },
    {
      "label": "Roblox Creator Rewards Announcement",
      "url": "https://devforum.roblox.com/t/introducing-creator-rewards-earn-more-by-growing-the-community/3777628"
    }
  ]
};
const TM = {
  "interview": {
    "label": "访谈",
    "fg": "#993C1D",
    "bg": "#FAECE7",
    "dot": "#D85A30"
  },
  "secondary": {
    "label": "二手资料",
    "fg": "#5F5E5A",
    "bg": "#F1EFE8",
    "dot": "#888780"
  },
  "note": {
    "label": "笔记",
    "fg": "#0F6E56",
    "bg": "#E1F5EE",
    "dot": "#1D9E75"
  },
  "report": {
    "label": "报告",
    "fg": "#185FA5",
    "bg": "#E6F1FB",
    "dot": "#378ADD"
  },
  "data": {
    "label": "数据",
    "fg": "#854F0B",
    "bg": "#FAEEDA",
    "dot": "#BA7517"
  },
  "event": {
    "label": "活动记录",
    "fg": "#534AB7",
    "bg": "#EEEDFE",
    "dot": "#7F77DD"
  }
};
const SL = {
  "draft": "草稿",
  "final": "已定稿",
  "archived": "已归档"
};
let st = {type:'all', topic:'all', status:'all', q:'', view:'tl'};
const stem = p => p.split('/').pop().replace(/\.md$/,'');
const byStem = {};
DATA.forEach(x => byStem[stem(x.path)] = x);

const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function docByRef(ref){ return DATA.find(x => stem(x.path) === ref); }
function openPage(page){
  const home = page === 'home';
  document.getElementById('homeView').classList.toggle('hidden', !home);
  document.getElementById('dbView').classList.toggle('hidden', home);
  document.getElementById('nav-home').classList.toggle('on', home);
  document.getElementById('nav-db').classList.toggle('on', !home);
  window.scrollTo({top:0, behavior:'smooth'});
}
function openTopic(topic){
  st.topic = topic;
  st.type = 'all'; st.status = 'all'; st.q = ''; st.view = 'cd';
  initFilters(); setView('cd'); openPage('db');
}
function renderHome(){
  const metricHTML = HOME.metrics.map(m => `<a class="metric" href="${esc(m.url)}" target="_blank" rel="noopener">
    <div class="mvalue">${esc(m.value)}</div><div class="mlabel">${esc(m.label)}</div>
    <div class="mdelta">${esc(m.delta)}</div><div class="mnote">${esc(m.note)}</div>
    <div class="msrc">${esc(m.source)}</div></a>`).join('');

  const creatorHTML = HOME.creator_metrics.map(m => `<a class="cmetric" href="${esc(m.url)}" target="_blank" rel="noopener">
    <div class="v">${esc(m.value)}</div><div class="l">${esc(m.label)}</div><div class="n">${esc(m.note)}</div></a>`).join('');

  const ecoHTML = HOME.ecosystem.map(e => {
    const refs = e.refs.map(ref => {
      const d = docByRef(ref);
      return d ? `<button class="ref" data-open="${esc(d.path)}">${esc(d.title)}</button>` : '';
    }).join('');
    return `<article class="ecocard"><div class="ecotop"><span class="ecok">${esc(e.kicker)}</span><span class="ecostatus">${esc(e.status)}</span></div>
      <h3>${esc(e.title)}</h3><div class="ecosum">${esc(e.summary)}</div>
      <ul>${e.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
      <div class="refrow">${refs}</div></article>`;
  }).join('');

  const eventHTML = (HOME.events || []).map(e => {
    const refs = e.refs.map(ref => {
      const d = docByRef(ref);
      return d ? `<button class="ref" data-open="${esc(d.path)}">${esc(d.title)}</button>` : '';
    }).join('');
    return `<article class="event"><div class="eventmeta"><span class="date">${esc(e.date)}</span><span>${esc(e.location)}</span></div>
      <h3>${esc(e.title)}</h3><div class="eventsum">${esc(e.summary)}</div>
      <ul>${e.takeaways.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
      <div class="refrow">${refs}</div></article>`;
  }).join('');

  const themeHTML = HOME.themes.map(g => `<article class="gcard"><h3>${esc(g.title)}</h3>
    <div class="gsum">${esc(g.summary)}</div><ul>${g.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
    <div class="tagrow">${g.topics.map(t => `<button class="htag" data-topic="${esc(t)}">${esc(t)} · ${DATA.filter(d=>d.topic.includes(t)).length}</button>`).join('')}</div></article>`).join('');

  const latest = DATA.filter(d => d.type === 'report').slice(0, 4).map(cardHTML).join('');
  const sources = HOME.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join('');

  document.getElementById('homeRoot').innerHTML = `
    <section class="hero"><div class="eyebrow">${esc(HOME.eyebrow)}</div><h1>${esc(HOME.headline)}</h1>
      <div class="hero-meta">更新至 ${esc(HOME.updated)} · ${DATA.length} 份材料 · ${DATA.filter(d=>d.type==='report').length} 份研究产出</div></section>

    <section class="hsection"><div class="secthead"><h2>核心判断</h2><span>先看结论，再进入材料</span></div>
      <div class="summarybox"><ul>${HOME.summary.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section>

    <section class="hsection"><div class="secthead"><h2>平台最新状态</h2><span>Q2 2026 · Roblox 官方 / SEC</span></div><div class="metrics">${metricHTML}</div></section>

    <section class="hsection"><div class="secthead"><h2>创作者经济：规模扩大，收入仍高度集中</h2><span>2025 全年口径</span></div>
      <div class="creatorstrip">${creatorHTML}</div></section>

    <section class="hsection"><div class="secthead"><h2>UGC 生态判断</h2><span>To C · To B · 作者 · 平台</span></div><div class="ecogrid">${ecoHTML}</div></section>

    <section class="hsection"><div class="secthead"><h2>活动</h2><span>一线交流与现场观察</span></div><div class="events">${eventHTML}</div></section>

    <section class="hsection"><div class="secthead"><h2>专题地图</h2><span>Notion 式 Gallery · 点标签进入资料库</span></div><div class="gallery">${themeHTML}</div></section>

    <section class="hsection"><div class="secthead"><h2>最新研究产出</h2><button class="htag" id="allReports">查看全部资料</button></div>
      <div class="latest">${latest}</div></section>

    <section class="hsection"><div class="secthead"><h2>数据来源</h2><span>首页外部数据只采用 Roblox 官方与 SEC 文件</span></div><div class="sources">${sources}</div></section>`;

  document.getElementById('homeRoot').querySelectorAll('[data-open]').forEach(n => n.onclick = () => openDoc(n.dataset.open));
  document.getElementById('homeRoot').querySelectorAll('[data-topic]').forEach(n => n.onclick = () => openTopic(n.dataset.topic));
  document.getElementById('homeRoot').querySelectorAll('.card').forEach(c => c.onclick = () => openDoc(c.dataset.id));
  document.getElementById('allReports').onclick = () => { st.type='report'; initFilters(); setView('cd'); openPage('db'); };
}

function initFilters(){
  const counts = {};
  DATA.forEach(d => counts[d.type] = (counts[d.type]||0)+1);
  const keys = Object.keys(TM).filter(k => counts[k]);
  const box = document.getElementById('types');
  box.innerHTML = `<button class="chip ${st.type==='all'?'on':''}" data-t="all">全部 <span style="opacity:.55">${DATA.length}</span></button>` +
    keys.map(k => `<button class="chip ${st.type===k?'on':''}" data-t="${k}">
      ${TM[k].label} <span style="opacity:.55">${counts[k]}</span></button>`).join('');
  box.querySelectorAll('.chip').forEach(b => b.onclick = () => { st.type = b.dataset.t; initFilters(); render(); });

  const topics = [...new Set(DATA.flatMap(d => d.topic))].sort();
  const sel = document.getElementById('topic');
  sel.innerHTML = `<option value="all">全部主题 (${topics.length})</option>` +
    topics.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  sel.value = st.topic;
  sel.onchange = () => { st.topic = sel.value; render(); };

  const statuses = [...new Set(DATA.map(d => d.status))];
  const ssel = document.getElementById('status');
  ssel.innerHTML = `<option value="all">全部状态</option>` +
    statuses.map(s => `<option value="${s}">${SL[s]||s}</option>`).join('');
  ssel.value = st.status;
  ssel.onchange = () => { st.status = ssel.value; render(); };

  const qi = document.getElementById('q');
  qi.value = st.q;
  qi.oninput = () => { st.q = qi.value.trim().toLowerCase(); render(); };

  document.getElementById('v-tl').onclick = () => setView('tl');
  document.getElementById('v-cd').onclick = () => setView('cd');
  document.getElementById('v-bd').onclick = () => setView('bd');
}

function setView(v){
  st.view = v;
  document.getElementById('v-tl').classList.toggle('on', v==='tl');
  document.getElementById('v-cd').classList.toggle('on', v==='cd');
  document.getElementById('v-bd').classList.toggle('on', v==='bd');
  render();
}

function filtered(){
  return DATA.filter(d => {
    if (st.type !== 'all' && d.type !== st.type) return false;
    if (st.topic !== 'all' && !d.topic.includes(st.topic)) return false;
    if (st.status !== 'all' && d.status !== st.status) return false;
    if (st.q){
      const hay = (d.title + ' ' + d.takeaway + ' ' + d.plain + ' ' + d.topic.join(' ')).toLowerCase();
      if (!hay.includes(st.q)) return false;
    }
    return true;
  });
}

function cardHTML(d){
  const t = TM[d.type] || TM.note;
  const badge = `<span class="badge" style="background:${t.bg};color:${t.fg}">${t.label}</span>`;
  const stat = `<span class="st ${d.status}">${SL[d.status]||d.status}</span>`;
  const meta = [d.date || '未标日期', ...d.topic.map(x => esc(x))]
    .filter(Boolean).map(x => `<span>${x}</span>`).join('<span class="sep">·</span>');
  return `<div class="card" data-id="${esc(d.path)}" style="--tint:${t.dot}">
    <div class="chead">${badge}<span class="ctitle">${esc(d.title)}</span>${stat}</div>
    ${d.takeaway ? `<div class="takeaway">${esc(d.takeaway)}</div>` : ''}
    <div class="meta">${meta}</div>
  </div>`;
}

function render(){
  const list = filtered();
  const el = document.getElementById('list');
  const nReport = list.filter(d => d.type === 'report').length;
  document.getElementById('stats').innerHTML =
    `共 <b>${list.length}</b> 份材料　其中产出 <b>${nReport}</b> 份`;

  if (!list.length){ el.innerHTML = `<div class="empty">没有符合条件的材料</div>`; return; }

  if (st.view === 'cd'){
    el.innerHTML = `<div class="grid">${list.map(cardHTML).join('')}</div>`;
  } else if (st.view === 'bd'){
    const topics = {};
    list.forEach(d => (d.topic.length ? d.topic : ['未标主题'])
      .forEach(tp => (topics[tp] = topics[tp] || []).push(d)));
    const keys = Object.keys(topics).sort((a, b) => topics[b].length - topics[a].length);
    el.innerHTML = `<div class="board">` + keys.map(tp =>
      `<div class="bcol"><h3>${esc(tp)}<em>${topics[tp].length} 份</em></h3>` +
      topics[tp].map(cardHTML).join('') + `</div>`).join('') + `</div>`;
  } else {
    const g = {};
    list.forEach(d => { const k = (d.date||'未标日期').slice(0,7); (g[k]=g[k]||[]).push(d); });
    el.innerHTML = Object.keys(g).sort().reverse().map(k => {
      const mm = k.length===7 ? k.slice(5)+' 月' : k;
      const ym = k.length===7 ? k.slice(0,4) : '';
      return `<div class="month" style="margin-top:6px">${ym} 年 ${mm}</div>
      <div class="group">
        <div class="gutter"><span class="ym">${k.length===7?k.slice(5):'—'}</span>
          <span class="dot" style="background:${(TM[g[k][0].type]||TM.note).dot}"></span></div>
        <div class="cards">${g[k].map(cardHTML).join('')}</div>
      </div>`;
    }).join('');
  }

  el.querySelectorAll('.card').forEach(c => c.onclick = () => openDoc(c.dataset.id));
}

function openDoc(id){
  const d = DATA.find(x => x.path === id);
  if (!d) return;
  const t = TM[d.type] || TM.note;
  const myStem = stem(d.path);

  const srcItems = d.source.map(s => {
    const hit = byStem[s];
    return hit ? `<li class="linkish" data-open="${esc(hit.path)}">${esc(s)}</li>`
               : `<li>${esc(s)}</li>`;
  }).join('');
  const src = srcItems
    ? `<div class="psrc"><span class="k">来源材料</span><ul>${srcItems}</ul></div>` : '';

  const backs = DATA.filter(x => x.source.includes(myStem));
  const backItems = backs.map(x =>
    `<li class="linkish" data-open="${esc(x.path)}">${esc(x.title)}</li>`).join('');
  const back = backItems
    ? `<div class="psrc"><span class="k">被引用</span><ul>${backItems}</ul></div>` : '';

  const origin = d.origin
    ? `<div class="originbox">原件　<code>${esc(d.origin)}</code><button class="copybtn" data-copy="${esc(d.origin)}">复制路径</button></div>` : '';

  document.getElementById('pcontent').innerHTML = `
    <div class="chead"><span class="badge" style="background:${t.bg};color:${t.fg}">${t.label}</span>
      <span class="st ${d.status}">${SL[d.status]||d.status}</span>
      ${d.version?`<span class="st">${esc(d.version)}</span>`:''}</div>
    <div class="ptitle">${esc(d.title)}</div>
    <div class="meta">
      <span>${d.date||'未标日期'}</span><span class="sep">·</span>
      <span>${d.words} 字</span>
      ${d.topic.map(x=>`<span class="sep">·</span><span>${esc(x)}</span>`).join('')}
    </div>
    ${d.takeaway?`<div class="ptake"><span class="lb">一句话结论</span>${esc(d.takeaway)}</div>`:''}
    ${src}${back}${origin}
    <div class="body">${d.html}</div>`;

  document.getElementById('pcontent').querySelectorAll('[data-open]').forEach(n =>
    n.onclick = () => openDoc(n.dataset.open));
  document.getElementById('pcontent').querySelectorAll('[data-copy]').forEach(n =>
    n.onclick = () => { navigator.clipboard.writeText(n.dataset.copy); n.textContent = '已复制'; });

  document.getElementById('panel').classList.add('on');
  document.getElementById('ov').classList.add('on');
  document.getElementById('panel').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

function closeDoc(){
  document.getElementById('panel').classList.remove('on');
  document.getElementById('ov').classList.remove('on');
  document.body.style.overflow = '';
}

document.getElementById('pclose').onclick = closeDoc;
document.getElementById('ov').onclick = closeDoc;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDoc(); });

document.getElementById('nav-home').onclick = () => openPage('home');
document.getElementById('nav-db').onclick = () => openPage('db');
renderHome();
initFilters();
render();
openPage('home');
</script>
</body>
</html>
